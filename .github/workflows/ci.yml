name: Java CI

on:
  push:
    branches: [main, develop, 'feature_*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package without shared database credentials
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Ensure local configuration and certificates are absent from the JAR
        shell: bash
        run: |
          set -euo pipefail
          jar tf target/uteexpress-0.0.1-SNAPSHOT.jar > target/jar-entries.txt
          if grep -E '(^|/)(application-(local|cloud)\.properties|aiven-local\.properties|ca\.pem)$|\.(p12|pfx|jks|key)$' target/jar-entries.txt; then
            echo 'Local configuration or certificate material must not be packaged.'
            exit 1
          fi
