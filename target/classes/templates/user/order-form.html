<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đơn gửi hàng - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 640px;">
    <h2 class="mb-4">Tạo đơn gửi hàng</h2>

    <form method="post" th:action="@{/nguoi-dung/tao-don}" th:object="${form}">
        <h5 class="mt-2">Người gửi</h5>
        <div class="mb-3">
            <label class="form-label">Tên người gửi</label>
            <input type="text" th:field="*{senderName}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('senderName')}" th:errors="*{senderName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Địa chỉ lấy hàng</label>
            <input type="text" th:field="*{senderAddress}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('senderAddress')}" th:errors="*{senderAddress}"></div>
        </div>

        <h5 class="mt-4">Người nhận</h5>
        <div class="mb-3">
            <label class="form-label">Tên người nhận</label>
            <input type="text" th:field="*{receiverName}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Số điện thoại người nhận</label>
            <input type="text" th:field="*{receiverPhone}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('receiverPhone')}" th:errors="*{receiverPhone}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Địa chỉ giao hàng</label>
            <input type="text" th:field="*{receiverAddress}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('receiverAddress')}" th:errors="*{receiverAddress}"></div>
        </div>

        <h5 class="mt-4">Gói hàng</h5>
        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Khối lượng (kg)</label>
                <input type="number" step="0.1" th:field="*{weightKg}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Dịch vụ</label>
                <select th:field="*{serviceType}" class="form-select">
                    <option value="STANDARD">Tiêu chuẩn (15.000đ + 3.000đ/kg)</option>
                    <option value="EXPRESS">Nhanh (25.000đ + 3.000đ/kg)</option>
                    <option value="SUPER_EXPRESS">Hỏa tốc (40.000đ + 3.000đ/kg)</option>
                </select>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Tạo đơn</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
