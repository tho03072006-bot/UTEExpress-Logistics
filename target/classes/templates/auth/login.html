<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 420px;">
    <h2 class="mb-4">Đăng nhập</h2>

    <div th:if="${activated}" class="alert alert-success">Kích hoạt tài khoản thành công, đăng nhập ngay.</div>
    <div th:if="${param.error}" class="alert alert-danger">Sai tên đăng nhập, mật khẩu, hoặc tài khoản chưa kích hoạt OTP.</div>
    <div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất.</div>

    <!-- Form nay do Spring Security formLogin xu ly (action mac dinh /dang-nhap, POST) -->
    <form method="post" th:action="@{/dang-nhap}">
        <div class="mb-3">
            <label class="form-label">Tên đăng nhập</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mật khẩu</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
    </form>
    <p class="text-center mt-3 small">Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký</a></p>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
