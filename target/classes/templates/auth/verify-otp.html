<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực OTP - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 420px;">
    <h2 class="mb-3">Xác thực OTP</h2>
    <p class="text-muted">
        Mã OTP đã được gửi tới email bạn đăng ký. Nếu chưa cấu hình email thật (SMTP),
        xem OTP trong console log của ứng dụng (xem SETUP.md).
    </p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post" th:action="@{/xac-thuc-otp}">
        <input type="hidden" name="username" th:value="${username}">
        <div class="mb-3">
            <label class="form-label">Mã OTP (6 số)</label>
            <input type="text" name="otp" class="form-control" maxlength="6" required autofocus>
        </div>
        <button type="submit" class="btn btn-primary w-100">Xác thực</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
