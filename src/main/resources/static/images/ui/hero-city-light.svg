<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none">
  <!-- Nền thẻ tiêu đề trang (bản cho nền màu đậm): bản đồ thành phố nhạt có khu nhà, đường, không vẽ xe/kiện/ghim để khỏi đè lên hình minh họa.
       Đậm dần về bên phải, bên trái gần như trong suốt để chữ tiêu đề luôn dễ đọc. -->
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="640" height="260" fill="url(#fade)"/></mask>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".18"/>
    </pattern>
    <linearGradient id="route" x1="0" x2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <g mask="url(#m)">
    <rect width="640" height="260" fill="url(#dots)"/>
    <!-- Khu nhà -->
    <g fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".1">
      <rect x="250" y="18" width="70" height="46" rx="8"/>
      <rect x="336" y="18" width="52" height="46" rx="8"/>
      <rect x="250" y="168" width="58" height="70" rx="8"/>
      <rect x="430" y="10" width="86" height="54" rx="8"/>
      <rect x="532" y="10" width="96" height="54" rx="8"/>
      <rect x="430" y="176" width="64" height="66" rx="8"/>
      <rect x="510" y="176" width="118" height="66" rx="8"/>
      <rect x="336" y="168" width="60" height="70" rx="8"/>
    </g>
    <!-- Công viên -->
    <rect x="432" y="88" width="74" height="60" rx="14" fill="#10B981" fill-opacity=".09"/>
    <circle cx="452" cy="108" r="9" fill="#10B981" fill-opacity=".18"/>
    <circle cx="478" cy="126" r="11" fill="#10B981" fill-opacity=".15"/>
    <!-- Đường phố có vạch giữa -->
    <g stroke="#FFFFFF" stroke-linecap="round">
      <path d="M200 80H640" stroke-opacity=".1" stroke-width="18"/>
      <path d="M200 156H640" stroke-opacity=".1" stroke-width="18"/>
      <path d="M412 0V260" stroke-opacity=".1" stroke-width="16"/>
      <path d="M526 70V170" stroke-opacity=".08" stroke-width="12"/>
      <path d="M220 80H640M220 156H640M412 10V250" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="6 8"/>
    </g>
    <!-- Lấp lánh -->
    <g fill="#6366F1" fill-opacity=".45">
      <path d="M492 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
      <path d="M330 128l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z"/>
      <circle cx="620" cy="120" r="3"/>
      <circle cx="470" cy="226" r="2.5"/>
    </g>
  </g>
</svg>
