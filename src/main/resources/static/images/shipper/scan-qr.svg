    <rect x="6" y="6" width="16" height="16" rx="2"/><rect x="10" y="10" width="8" height="8" fill="#F1F5F9"/>
    <rect x="38" y="6" width="16" height="16" rx="2"/><rect x="42" y="10" width="8" height="8" fill="#F1F5F9"/>
