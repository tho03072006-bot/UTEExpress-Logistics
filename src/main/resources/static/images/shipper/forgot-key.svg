  </defs>
  <circle cx="110" cy="124" r="72" fill="#FFFFFF" opacity=".12"/>
  <ellipse cx="172" cy="218" rx="106" ry="8" fill="#000" opacity=".2"/>
  <!-- chìa khóa lớn -->
  <g transform="translate(110 150) rotate(-35)">
    <path fill-rule="evenodd" d="M-38 0 a38 38 0 1 0 76 0 a38 38 0 1 0 -76 0 Z M-14 0 a14 14 0 1 0 28 0 a14 14 0 1 0 -28 0 Z" fill="url(#key)"/>
    <rect x="34" y="-10" width="112" height="20" rx="6" fill="url(#key)"/>
    <rect x="106" y="8" width="14" height="22" rx="3" fill="#F59E0B"/>
    <rect x="126" y="8" width="12" height="15" rx="3" fill="#F59E0B"/>
    <rect x="42" y="-5" width="96" height="4" rx="2" fill="#FFFFFF" opacity=".45"/>
  </g>
  <!-- bóng nói có dấu hỏi -->
