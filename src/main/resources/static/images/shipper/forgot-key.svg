    <path d="M-34 -30 h68 a14 14 0 0 1 14 14 v32 a14 14 0 0 1 -14 14 h-40 l-14 14 v-14 h-14 a14 14 0 0 1 -14 -14 v-32 a14 14 0 0 1 14 -14 z" fill="#FFFFFF"/>
