<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Màn hình bảng điều khiển vận hành">
  <defs>
    <linearGradient id="mm-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <linearGradient id="mm-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#0072BC"/></linearGradient>
    <linearGradient id="mm-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity=".35"/><stop offset="1" stop-color="#F59E0B" stop-opacity="0"/></linearGradient>
  </defs>
  <ellipse cx="180" cy="224" rx="118" ry="7" fill="#000" opacity=".16"/>
  <!-- chân và đế màn hình -->
  <path d="M162 186 L 156 212 H 204 L 198 186 Z" fill="#334155"/>
  <rect x="126" y="208" width="108" height="9" rx="4.5" fill="#1E293B"/>
