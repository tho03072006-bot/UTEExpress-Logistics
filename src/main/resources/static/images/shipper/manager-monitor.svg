  <g fill="#FCD34D"><path d="M30 46 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z"/><path d="M26 176 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity=".8"/></g>
