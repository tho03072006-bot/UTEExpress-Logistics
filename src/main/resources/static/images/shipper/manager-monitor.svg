    <circle r="17" fill="none" stroke="#22C55E" stroke-width="7" stroke-dasharray="62 107" transform="rotate(-90)"/>
    <circle r="17" fill="none" stroke="#0072BC" stroke-width="7" stroke-dasharray="26 107" stroke-dashoffset="-62" transform="rotate(-90)"/>
    <circle r="17" fill="none" stroke="#F59E0B" stroke-width="7" stroke-dasharray="12 107" stroke-dashoffset="-88" transform="rotate(-90)"/>
  </g>
