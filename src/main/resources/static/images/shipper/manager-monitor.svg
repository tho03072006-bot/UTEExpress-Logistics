    <rect x="186" y="90" width="108" height="78" rx="6" fill="#E0F2FE"/>
    <path d="M186 132 C 214 120 226 150 252 138 S 284 112 294 120" fill="none" stroke="#BAE6FD" stroke-width="7"/>
    <path d="M204 152 L 236 118 L 272 136" fill="none" stroke="#0072BC" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"/>
