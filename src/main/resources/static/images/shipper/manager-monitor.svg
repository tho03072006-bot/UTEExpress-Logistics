  <!-- chậu cây -->
  <g transform="translate(330 198)">
    <path d="M-12 0 H 12 L 9 20 H -9 Z" fill="#F59E0B"/>
    <path d="M0 0 C -4 -16 -18 -22 -20 -30 C -6 -28 -2 -16 0 0 Z" fill="#22C55E"/>
