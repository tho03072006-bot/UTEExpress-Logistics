    <rect x="92" y="126" width="11" height="42" rx="2" fill="url(#mm-bar)" opacity=".7"/>
    <rect x="108" y="132" width="11" height="36" rx="2" fill="url(#mm-bar)" opacity=".6"/>
    <rect x="124" y="112" width="11" height="56" rx="2" fill="url(#mm-bar)"/>
    <rect x="140" y="120" width="11" height="48" rx="2" fill="url(#mm-bar)" opacity=".8"/>
    <rect x="156" y="100" width="11" height="68" rx="2" fill="url(#mm-bar)"/>
    <path d="M81 128 L 97 116 L 113 120 L 129 102 L 145 108 L 161 90 L 161 168 L 81 168 Z" fill="url(#mm-area)"/>
    <path d="M81 128 L 97 116 L 113 120 L 129 102 L 145 108 L 161 90" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
