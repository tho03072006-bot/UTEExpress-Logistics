  <rect x="58" y="28" width="244" height="152" rx="9" fill="url(#mm-screen)"/>
  <!-- thanh tiêu đề cửa sổ -->
  <rect x="58" y="28" width="244" height="18" rx="9" fill="#E2E8F0"/>
  <rect x="58" y="37" width="244" height="9" fill="#E2E8F0"/>
  <circle cx="69" cy="37" r="3" fill="#FB7185"/><circle cx="79" cy="37" r="3" fill="#FCD34D"/><circle cx="89" cy="37" r="3" fill="#34D399"/>
  <rect x="210" y="33" width="84" height="8" rx="4" fill="#FFFFFF"/>
  <!-- ba ô KPI -->
  <g>
    <rect x="66" y="52" width="54" height="26" rx="5" fill="#E0E7FF"/><rect x="72" y="58" width="22" height="5" rx="2.5" fill="#6366F1"/><rect x="72" y="67" width="34" height="6" rx="3" fill="#4338CA"/>
    <rect x="126" y="52" width="54" height="26" rx="5" fill="#DCFCE7"/><rect x="132" y="58" width="22" height="5" rx="2.5" fill="#22C55E"/><rect x="132" y="67" width="30" height="6" rx="3" fill="#15803D"/>
    <rect x="186" y="52" width="54" height="26" rx="5" fill="#FFE4E6"/><rect x="192" y="58" width="22" height="5" rx="2.5" fill="#F43F5E"/><rect x="192" y="67" width="26" height="6" rx="3" fill="#BE123C"/>
  </g>
  <!-- biểu đồ cột + đường xu hướng -->
