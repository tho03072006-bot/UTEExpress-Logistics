    <circle cx="-20" cy="11" r="8" fill="#DCFCE7"/>
    <path d="M-24 11 l3 3 6 -6" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
