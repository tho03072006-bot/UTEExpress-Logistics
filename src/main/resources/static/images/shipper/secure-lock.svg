<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Khiên và ổ khóa bảo mật tài khoản">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
    <linearGradient id="lock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
  </defs>
  <ellipse cx="180" cy="218" rx="112" ry="9" fill="#000" opacity=".2"/>
  <!-- khiên -->
  <path d="M180 22 L 266 54 V 116 C 266 168 228 200 180 214 C 132 200 94 168 94 116 V 54 Z" fill="url(#shield)"/>
  <path d="M180 40 L 250 66 V 116 C 250 158 220 186 180 198 Z" fill="#FFFFFF" opacity=".16"/>
  <!-- ổ khóa -->
  <path d="M154 112 v -16 a 26 26 0 0 1 52 0 v 16" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
  <rect x="140" y="108" width="80" height="62" rx="12" fill="url(#lock)"/>
  <circle cx="180" cy="134" r="8" fill="#92400E"/>
  <rect x="176" y="136" width="8" height="18" rx="3" fill="#92400E"/>
  <!-- ô mật khẩu -->
  <g transform="translate(36 152)">
    <rect width="92" height="34" rx="10" fill="#FFFFFF" opacity=".95"/>
    <g fill="#4F46E5"><circle cx="20" cy="17" r="5"/><circle cx="38" cy="17" r="5"/><circle cx="56" cy="17" r="5"/><circle cx="74" cy="17" r="5"/></g>
  </g>
  <!-- dấu tích xác minh -->
  <g transform="translate(286 70)">
    <circle r="24" fill="#22C55E"/><path d="M-10 0 l7 7 13 -14" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M60 60 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" opacity=".85"/>
    <path d="M300 170 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z" opacity=".65"/>
  </g>
</svg>
