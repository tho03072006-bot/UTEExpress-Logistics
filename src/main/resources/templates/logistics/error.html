<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head><title>Không thể xử lý - UTEExpress</title></head><body><section class="shipper-workspace">
<div class="ute-panel sx-error-panel" role="alert">
    <span class="sx-error-icon" aria-hidden="true"><i class="bi" th:classappend="${status == 403} ? 'bi-shield-lock' : (${status == 409} ? 'bi-arrow-repeat' : 'bi-exclamation-triangle')"></i></span>
    <div><span class="shipper-eyebrow" th:text="${status != null ? 'MÃ LỖI ' + status : 'KHÔNG THỂ XỬ LÝ'}">KHÔNG THỂ XỬ LÝ</span>
        <h2>Không thể xử lý yêu cầu</h2><p th:text="${error}"></p>
        <div class="d-flex flex-wrap gap-2"><a class="btn btn-primary" th:href="@{${backUrl != null ? backUrl : '/'}}"><i class="bi bi-house"></i> Về trang làm việc</a>
            <button type="button" class="btn btn-outline-secondary" onclick="history.back()"><i class="bi bi-arrow-left"></i> Quay lại</button></div></div>
</div>
</section></body></html>
