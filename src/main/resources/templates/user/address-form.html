<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head>
    <title th:text="${editingId} == null ? 'Thêm địa chỉ - UTEExpress' : 'Sửa địa chỉ - UTEExpress'">Địa chỉ - UTEExpress</title>
</head>
<body>

<section class="ute-narrow">
<div class="ute-page-head sx-art-house"><div><h2 th:text="${editingId} == null ? 'Thêm địa chỉ mới' : 'Sửa địa chỉ'">Thêm địa chỉ mới</h2>
</div></div>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<!-- Dùng chung một form cho cả thêm mới và chỉnh sửa, chỉ khác đường dẫn submit -->
<form method="post" th:object="${form}"
      th:action="${editingId} == null
                 ? @{/nguoi-dung/dia-chi/them}
                 : @{'/nguoi-dung/dia-chi/' + ${editingId} + '/sua'}">

    <div class="mb-3">
        <label class="form-label">Loại địa chỉ</label>
        <select th:field="*{addressType}" class="form-select">
            <option th:each="type : ${addressTypes}"
                    th:value="${type}"
                    th:text="${type.displayName}"></option>
        </select>
        <div class="text-danger small" th:if="${#fields.hasErrors('addressType')}" th:errors="*{addressType}"></div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="label">Nhãn gợi nhớ</label>
        <input type="text" th:field="*{label}" class="form-control" required maxlength="50" placeholder="Ví dụ: Nhà riêng, Kho quận 9, Nhà mẹ">
        <div class="text-danger small" th:if="${#fields.hasErrors('label')}" th:errors="*{label}"></div>
    </div>

    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label" for="contactName">Họ tên người liên hệ</label>
            <input type="text" th:field="*{contactName}" class="form-control" required minlength="2" maxlength="100">
            <div class="text-danger small" th:if="${#fields.hasErrors('contactName')}" th:errors="*{contactName}"></div>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label" for="contactPhone">Số điện thoại</label>
            <input type="tel" th:field="*{contactPhone}" class="form-control" required data-vn-mobile maxlength="20" inputmode="tel" autocomplete="tel" placeholder="0901234567">
            <div class="text-danger small" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}"></div>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label" for="addressLine">Địa chỉ chi tiết</label>
        <textarea th:field="*{addressLine}" class="form-control" rows="2" required minlength="5" maxlength="255"
                  placeholder="Số nhà, đường, phường/xã"></textarea>
        <div class="form-text">Tổng địa chỉ chi tiết, phường/xã và tỉnh/thành không quá 255 ký tự để dùng được khi tạo đơn.</div>
        <div class="text-danger small" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}"></div>
    </div>

    <div th:replace="~{fragments/area-fields :: fields('provinceCode', 'areaCode')}"></div>
    <div class="form-check mb-4">
        <input type="checkbox" th:field="*{defaultAddress}" class="form-check-input" id="defaultAddress">
        <label class="form-check-label" for="defaultAddress">Đặt làm địa chỉ mặc định của loại này</label>
    </div>

    <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary"
                th:text="${editingId} == null ? 'Lưu địa chỉ' : 'Cập nhật'">Lưu địa chỉ</button>
        <a th:href="@{/nguoi-dung/dia-chi}" class="btn btn-outline-secondary">Quay lại sổ địa chỉ</a>
    </div>
</form>
</section>

</body>
</html>
