<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn hàng của tôi - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Đơn hàng của tôi</h2>
        <a th:href="@{/nguoi-dung/tao-don}" class="btn btn-primary">+ Tạo đơn mới</a>
    </div>

    <!-- TODO (TV1): them filter theo trang thai/thoi gian nhu de bai yeu cau -->
    <div th:if="${#lists.isEmpty(orders)}" class="text-muted">Chưa có đơn hàng nào.</div>

    <table class="table" th:unless="${#lists.isEmpty(orders)}">
        <thead>
            <tr>
                <th>Mã vận đơn</th>
                <th>Người nhận</th>
                <th>Dịch vụ</th>
                <th>Cước phí</th>
                <th>Trạng thái</th>
                <th>Ngày tạo</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.trackingCode}">-</td>
                <td th:text="${order.receiverName}">-</td>
                <td th:text="${order.serviceType}">-</td>
                <td th:text="${order.shippingFee} + ' đ'">0</td>
                <td><span class="badge bg-secondary" th:text="${order.status}">-</span></td>
                <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">-</td>
            </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
