<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head>
    <title>Đổi mật khẩu - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-2">Đổi mật khẩu</h2>
<p class="text-muted">Nhập mật khẩu hiện tại để xác nhận đúng bạn là chủ tài khoản.</p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="ute-panel">
    <form method="post" th:object="${form}" th:action="@{/nguoi-dung/tai-khoan/doi-mat-khau}">

        <div class="mb-3">
            <label class="form-label" for="currentPassword">Mật khẩu hiện tại</label>
            <input type="password" id="currentPassword" th:field="*{currentPassword}"
                   class="form-control" autocomplete="current-password">
            <div class="ute-field-error" th:if="${#fields.hasErrors('currentPassword')}"
                 th:errors="*{currentPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">Mật khẩu mới</label>
            <input type="password" id="newPassword" th:field="*{newPassword}"
                   class="form-control" autocomplete="new-password">
            <div class="form-text">Ít nhất 6 ký tự và phải khác mật khẩu hiện tại.</div>
            <div class="ute-field-error" th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-4">
            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                   class="form-control" autocomplete="new-password">
            <div class="ute-field-error" th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Đổi mật khẩu</button>
            <a th:href="@{/nguoi-dung/tai-khoan}" class="btn btn-outline-secondary">Huỷ</a>
        </div>
    </form>
</div>

<p class="ute-profile-note mt-3">
    Quên mất mật khẩu hiện tại? Hãy đăng xuất rồi dùng chức năng
    <a th:href="@{/quen-mat-khau}">quên mật khẩu</a> để nhận mã OTP qua email.
</p>
</section>

</body>
</html>
