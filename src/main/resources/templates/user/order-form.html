<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head>
    <title>Tạo đơn gửi hàng - UTEExpress</title>
</head>
<body>

<section class="ute-narrow">
<div class="ute-page-head sx-art-create"><div><h2>Tạo đơn gửi hàng</h2>
</div></div>

<div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form method="post" th:action="@{/nguoi-dung/tao-don}" th:object="${form}" data-order-form>
    <input type="hidden" name="submissionToken" th:value="${form.submissionToken}">
    <div class="alert alert-warning" th:if="${#fields.hasErrors('submissionToken')}" th:errors="*{submissionToken}"></div>
    <h5 class="mt-2">Người gửi</h5>

    <!-- Chọn nhanh từ sổ địa chỉ: JS trong address-picker.js sẽ điền vào 2 ô bên dưới -->
    <div class="mb-3" th:if="${!#lists.isEmpty(senderAddresses)}">
        <label class="form-label" for="senderAddressId">Chọn từ sổ địa chỉ</label>
        <select th:field="*{senderAddressId}" class="form-select"
                data-address-picker="sender"
                data-fill-name="senderName"
                data-fill-address="senderAddress">
            <option value="">-- Nhập địa chỉ mới --</option>
            <option th:each="address : ${senderAddresses}"
                    th:value="${address.id}"
                    th:attr="data-contact-name=${address.contactName},
                             data-contact-phone=${address.contactPhone},
                             data-address-line=${address.addressLine}"
                    th:text="|${address.label} — ${address.contactName} · ${address.addressLine}|"></option>
        </select>
    </div>
    <div class="alert alert-light border mb-3" th:if="${#lists.isEmpty(senderAddresses)}">
        Chưa có địa chỉ gửi. <a th:href="@{/nguoi-dung/dia-chi/them}">Lưu địa chỉ</a>
    </div>

    <div class="mb-3">
        <label class="form-label" for="senderName">Tên người gửi</label>
        <input type="text" th:field="*{senderName}" class="form-control" required minlength="2" maxlength="100">
        <div class="text-danger small" th:if="${#fields.hasErrors('senderName')}" th:errors="*{senderName}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="senderAddress">Địa chỉ lấy hàng</label>
        <input type="text" th:field="*{senderAddress}" class="form-control" required minlength="5" maxlength="255">
        <div class="text-danger small" th:if="${#fields.hasErrors('senderAddress')}" th:errors="*{senderAddress}"></div>
    </div>

    <h5 class="mt-4">Người nhận</h5>

    <!-- Cố ý KHÔNG điền sẵn người nhận: mỗi đơn thường gửi cho một người khác nhau -->
    <div class="mb-3" th:if="${!#lists.isEmpty(receiverAddresses)}">
        <label class="form-label" for="receiverAddressId">Chọn từ sổ địa chỉ</label>
        <select th:field="*{receiverAddressId}" class="form-select"
                data-address-picker="receiver"
                data-fill-name="receiverName"
                data-fill-phone="receiverPhone"
                data-fill-address="receiverAddress">
            <option value="">-- Nhập địa chỉ mới --</option>
            <option th:each="address : ${receiverAddresses}"
                    th:value="${address.id}"
                    th:attr="data-contact-name=${address.contactName},
                             data-contact-phone=${address.contactPhone},
                             data-address-line=${address.addressLine}"
                    th:text="|${address.label} — ${address.contactName} · ${address.addressLine}|"></option>
        </select>
    </div>
    <div class="alert alert-light border mb-3" th:if="${#lists.isEmpty(receiverAddresses)}">
        Chưa có địa chỉ người nhận. <a th:href="@{/nguoi-dung/dia-chi/them}">Lưu địa chỉ</a>
    </div>

    <div class="mb-3">
        <label class="form-label" for="receiverName">Tên người nhận</label>
        <input type="text" th:field="*{receiverName}" class="form-control" required minlength="2" maxlength="100">
        <div class="text-danger small" th:if="${#fields.hasErrors('receiverName')}" th:errors="*{receiverName}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="receiverPhone">Số điện thoại người nhận</label>
        <input type="tel" th:field="*{receiverPhone}" class="form-control" required maxlength="20" inputmode="tel" placeholder="0901234567 hoặc +84901234567">
        <div class="text-danger small" th:if="${#fields.hasErrors('receiverPhone')}" th:errors="*{receiverPhone}"></div>
    </div>
    <div class="mb-3">
        <label class="form-label" for="receiverAddress">Địa chỉ giao hàng</label>
        <input type="text" th:field="*{receiverAddress}" class="form-control" required minlength="5" maxlength="255">
        <div class="text-danger small" th:if="${#fields.hasErrors('receiverAddress')}" th:errors="*{receiverAddress}"></div>
    </div>

    <h5 class="mt-4">Gói hàng</h5>
    <div class="row">
        <div class="col-sm-4 mb-3">
            <label class="form-label" for="weightKg">Khối lượng (kg)</label>
            <input type="number" step="0.01" min="0.01" max="100" required th:field="*{weightKg}" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></div>
        </div>
        <div class="col-sm-8 mb-3">
            <label class="form-label" for="serviceType">Dịch vụ</label>
            <select th:field="*{serviceType}" class="form-select">
                <option th:each="tariff : ${currentTariffs}" th:value="${tariff.serviceType}"
                    th:text="|${tariff.serviceType.displayName} (${#numbers.formatDecimal(tariff.baseFee,0,'POINT',0,'COMMA')}đ + ${#numbers.formatDecimal(tariff.feePerKg,0,'POINT',0,'COMMA')}đ/kg)|"></option>
            </select>
        </div>
    </div>

    <h5 class="mt-4">Mã giảm giá</h5>
    <div class="mb-4">
        <label class="form-label" for="promoCode">Mã giảm cước (không bắt buộc)</label>
        <input type="text" th:field="*{promoCode}" maxlength="30" class="form-control ute-promo-input"
               placeholder="Ví dụ: UTE10" autocomplete="off">
    </div>

    <h5 class="mt-4">Thanh toán cước</h5>
    <div class="mb-2">
        <!-- Radio thay vi dropdown: 3 lua chon, hien het ra cho nguoi dung thay ngay -->
        <div class="form-check" th:each="method : ${paymentMethods}">
            <input type="radio" th:field="*{paymentMethod}" th:value="${method}" class="form-check-input">
            <label class="form-check-label" th:for="${#ids.prev('paymentMethod')}">
                <span th:text="${method.displayName}">-</span>
                <span class="text-muted small" th:if="${method.onlineWallet}">— trả trước (mô phỏng)</span>
                <span class="text-muted small" th:unless="${method.onlineWallet}">— trả tiền mặt khi nhận hàng</span>
            </label>
        </div>
        <div class="text-danger small" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></div>
        <div class="text-danger small" th:if="${#fields.hasErrors('paymentMethodSupported')}" th:errors="*{paymentMethodSupported}"></div>
    </div>
    <div class="mb-4"></div>

    <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">Gửi đơn ngay</button>
        <!-- Cung mot form, chi doi dich submit: gom vao gio thay vi sinh van don ngay -->
        <button type="submit" class="btn btn-outline-primary"
                th:formaction="@{/nguoi-dung/tao-don/them-vao-gio}">Thêm vào giỏ đơn</button>
        <a th:href="@{/nguoi-dung/dia-chi}" class="btn btn-outline-secondary">Quản lý sổ địa chỉ</a>
    </div>
</form>
<p class="text-muted small">Giá đang hiệu lực lúc tải trang; cước được chốt theo bảng giá Aiven khi tạo đơn thành công.</p>
<script defer th:src="@{/js/order-form.js}"></script>
</section>

</body>
</html>
