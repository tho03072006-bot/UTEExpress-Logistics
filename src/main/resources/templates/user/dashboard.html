<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang tổng quan - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5">
    <h2>Xin chào, <span th:text="${username}">user</span></h2>
    <p class="text-muted">Bạn đang có <strong th:text="${orderCount}">0</strong> đơn gửi hàng.</p>

    <div class="d-flex flex-wrap gap-2 mt-4">
        <a th:href="@{/nguoi-dung/tao-don}" class="btn btn-primary">+ Tạo đơn gửi hàng</a>
        <a th:href="@{/nguoi-dung/don-hang}" class="btn btn-outline-secondary">Xem đơn hàng của tôi</a>
        <a th:href="@{/nguoi-dung/dia-chi}" class="btn btn-outline-secondary">Sổ địa chỉ</a>
        <a th:href="@{/nguoi-dung/gio-don}" class="btn btn-outline-secondary">
            Giỏ đơn chờ xác nhận
            <span class="badge badge-ute" th:if="${cartCount != null and cartCount > 0}" th:text="${cartCount}">0</span>
        </a>
    </div>

    <!-- TODO (TV1): them danh gia dich vu, ma giam gia... -->
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
