<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tạo đơn thành công - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 520px;">
    <div class="alert alert-success">Tạo đơn thành công!</div>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">Mã vận đơn</h5>
            <p class="fs-4 fw-bold" th:text="${order.trackingCode}">UTE00000000</p>
            <p>Người nhận: <span th:text="${order.receiverName}">-</span></p>
            <p>Dịch vụ: <span th:text="${order.serviceType}">-</span></p>
            <p>Cước phí: <span th:text="${order.shippingFee} + ' đ'">0</span></p>
            <p>Trạng thái: <span class="badge bg-secondary" th:text="${order.status}">-</span></p>
        </div>
    </div>

    <div class="d-flex gap-2 mt-3">
        <a th:href="@{/nguoi-dung/don-hang}" class="btn btn-outline-secondary">Xem đơn hàng của tôi</a>
        <a th:href="@{/nguoi-dung/tao-don}" class="btn btn-primary">Tạo đơn khác</a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
