<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head>
    <title>Tạo đơn thành công - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<div class="alert alert-success">Tạo đơn thành công!</div>

<div class="card">
    <div class="card-body">
        <h5 class="card-title">Mã vận đơn</h5>
        <p class="fs-4 fw-bold" th:text="${order.trackingCode}">UTE00000000</p>
        <p>Người nhận: <span th:text="${order.receiverName}">-</span></p>
        <p>Dịch vụ: <span th:text="${order.serviceType}">-</span></p>
        <p>Cước phí: <span th:replace="~{fragments/components :: money(${order.shippingFee})}">0 đ</span></p>
        <p>Trạng thái: <span class="badge bg-secondary" th:text="${order.status}">-</span></p>
        <p th:if="${payment != null}" class="mb-0">
            Thanh toán: <span th:text="${payment.method.displayName}">-</span> &middot;
            <span class="badge"
                  th:classappend="${'badge-payment-' + #strings.toLowerCase(payment.status.name())}"
                  th:text="${payment.status.displayName}">-</span>
        </p>
        <p th:if="${payment != null and payment.method.name() == 'COD'}" class="text-muted small mt-2 mb-0">
            Shipper sẽ thu cước khi giao hàng thành công.
        </p>
    </div>
</div>

<div class="d-flex gap-2 mt-3">
    <a th:href="@{/nguoi-dung/don-hang}" class="btn btn-outline-secondary">Xem đơn hàng của tôi</a>
    <a th:href="@{/nguoi-dung/tao-don}" class="btn btn-primary">Tạo đơn khác</a>
</div>
</section>

</body>
</html>
