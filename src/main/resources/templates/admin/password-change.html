<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Đổi mật khẩu nội bộ - UTEExpress</title></head>
<body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav>
<div class="ute-panel p-4 mx-auto" style="max-width:640px"><h1 class="h3">Đổi mật khẩu nội bộ</h1>
<p>Tài khoản vừa được cấp hoặc cấp lại mật khẩu phải đổi mật khẩu trước khi sử dụng chức năng quản lý.</p>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<form th:action="@{/noi-bo/doi-mat-khau}" th:object="${form}" method="post">
<div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><ul class="mb-0"><li th:each="e : ${#fields.allErrors()}" th:text="${e}"></li></ul></div>
<div class="mb-3"><label for="currentPassword" class="form-label">Mật khẩu hiện tại / mật khẩu vừa được cấp</label>
<input id="currentPassword" name="currentPassword" type="password" required maxlength="100" class="form-control" autocomplete="current-password"></div>
<div class="mb-3"><label for="password" class="form-label">Mật khẩu mới</label>
<input id="password" name="password" type="password" class="form-control" required minlength="12" maxlength="64" autocomplete="new-password" aria-describedby="password-help"></div>
<div class="mb-3"><label for="confirmPassword" class="form-label">Nhập lại mật khẩu mới</label>
<input id="confirmPassword" name="confirmPassword" type="password" class="form-control" required minlength="12" maxlength="64" autocomplete="new-password"></div>
<p id="password-help" class="text-muted small">12–64 ký tự, có chữ hoa, chữ thường, số và ký tự đặc biệt; không có khoảng trắng; tối đa 72 byte UTF-8. Bàn giao mật khẩu qua kênh riêng.</p><button type="submit" class="btn btn-primary">Đổi mật khẩu và đăng nhập lại</button>
</form></div>
</section></body>
</html>
