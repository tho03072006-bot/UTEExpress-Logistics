<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Nhật ký thao tác nội bộ - UTEExpress</title></head><body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav>
<h1 class="h3">Nhật ký thao tác nội bộ</h1>
<div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
<p>Chỉ Admin xem. Nhật ký gồm các thao tác mới sau nâng cấp; không lưu mật khẩu hay thông tin địa chỉ khách hàng. Không có chức năng sửa/xóa nhật ký.</p>
<div class="table-responsive"><table class="table"><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Thao tác</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead>
<tbody><tr th:each="event : ${events}"><td th:text="${#temporals.format(event.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
<td th:text="${event.actor}"></td><td th:text="${event.action}"></td><td th:text="${event.target}"></td><td th:text="${event.detail}"></td></tr>
<tr th:if="${events.empty}"><td colspan="5">Chưa có thao tác mới.</td></tr></tbody></table></div><div class="d-flex gap-3 align-items-center mt-3">
<a class="btn btn-outline-secondary btn-sm" th:if="${events.hasPrevious()}" th:href="@{/admin/nhat-ky(page=${events.number - 1})}">Trang trước</a>
<span th:text="|${events.number + 1} / ${events.totalPages == 0 ? 1 : events.totalPages}|"></span>
<a class="btn btn-outline-secondary btn-sm" th:if="${events.hasNext()}" th:href="@{/admin/nhat-ky(page=${events.number + 1})}">Trang sau</a></div>
</section></body></html>
