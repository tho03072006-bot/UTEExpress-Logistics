<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Cấp lại mật khẩu tài khoản - UTEExpress</title></head><body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav><div class="ute-panel p-4 mx-auto" style="max-width:760px">
<h1 class="h3">Cấp lại mật khẩu: <span th:text="${account.username}"></span></h1>
<p>Chỉ dùng sau khi xác minh chủ tài khoản. Phiên cũ, mã OTP và yêu cầu đổi email đang chờ sẽ bị hủy. Tài khoản bị khóa phải được mở trước.</p>
<form th:action="@{/admin/quan-ly-tai-khoan/{id}/mat-khau(id=${account.id})}" th:object="${form}" method="post">
<div th:replace="~{admin/account-form-fragments :: errors}"></div>
<div th:replace="~{admin/account-form-fragments :: credentials}"></div>
<div th:replace="~{admin/account-form-fragments :: action}"></div>
<button class="btn btn-primary" type="submit">Cấp lại mật khẩu</button> <a class="btn btn-outline-secondary" th:href="@{/admin/quan-ly-tai-khoan}">Hủy</a>
</form></div></section></body></html>
