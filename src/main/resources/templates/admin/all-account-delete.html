<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Xác nhận xóa tài khoản - UTEExpress</title></head><body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav><div class="ute-panel p-4 mx-auto" style="max-width:760px">
<div class="sx-panel-head"><div><h1 class="h3">Xóa tài khoản: <span th:text="${account.username}"></span></h1>
<p><span th:text="${account.fullName}"></span> · <span th:text="${account.role}"></span> · <span th:text="${account.email}"></span></p></div><img th:src="@{/images/shipper/team-accounts.svg}" alt="" aria-hidden="true" width="180" height="120"></div>
<div class="alert alert-danger">Xóa thật và không thể hoàn tác bằng giao diện. Hệ thống sẽ từ chối nếu tài khoản có dữ liệu liên kết; khi đó hãy khóa thay vì xóa. Không xóa chính mình hoặc Admin hoạt động cuối cùng. Nhật ký thao tác luôn được giữ.</div>
<form th:action="@{/admin/quan-ly-tai-khoan/{id}/xoa(id=${account.id})}" th:object="${form}" method="post">
<div th:replace="~{admin/account-form-fragments :: errors}"></div>
<div class="mb-3"><label for="confirmedUsername" class="form-label">Nhập chính xác tên đăng nhập cần xóa</label><input th:field="*{confirmedUsername}" class="form-control" required maxlength="50" autocomplete="off"></div>
<div th:replace="~{admin/account-form-fragments :: action}"></div>
<button class="btn btn-danger" type="submit">Xác nhận xóa tài khoản</button> <a class="btn btn-outline-secondary" th:href="@{/admin/quan-ly-tai-khoan}">Hủy</a>
</form></div></section></body></html>
