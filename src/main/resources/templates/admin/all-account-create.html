<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Thêm tài khoản - UTEExpress</title></head><body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav><div class="ute-panel p-4 mx-auto" style="max-width:760px">
<h1 class="h3">Admin · Thêm tài khoản</h1><p>Cấp bằng mật khẩu, không cần OTP.</p>
<form th:action="@{/admin/quan-ly-tai-khoan/tao}" th:object="${form}" method="post">
<div th:replace="~{admin/account-form-fragments :: errors}"></div>
<div class="mb-3"><label for="username" class="form-label">Tên đăng nhập</label><input th:field="*{username}" class="form-control" required minlength="4" maxlength="50" pattern="[a-z][a-z0-9._-]{3,49}" autocomplete="off"><div class="form-text">4–50 ký tự, bắt đầu bằng chữ thường.</div></div>
<div class="mb-3"><label for="fullName" class="form-label">Họ và tên</label><input th:field="*{fullName}" class="form-control" required minlength="2" maxlength="100"></div>
<div class="mb-3"><label for="email" class="form-label">Email</label><input th:field="*{email}" type="email" class="form-control" required maxlength="100"></div>
<div class="mb-3"><label for="phone" class="form-label">Số điện thoại</label><input th:field="*{phone}" type="tel" class="form-control" required data-vn-mobile maxlength="20" placeholder="0901234567 hoặc +84 901 234 567"></div>
<div class="mb-3"><label for="role" class="form-label">Vai trò</label><select th:field="*{role}" class="form-select" required>
<option value="">Chọn vai trò</option><option value="USER">User (người gửi)</option><option value="SHIPPER">Shipper</option><option value="MANAGER">Manager</option><option value="ADMIN">Admin</option></select></div>
<div th:replace="~{admin/branch-fields :: fields('assignment', 'role')}"></div>
<div th:replace="~{admin/account-form-fragments :: credentials}"></div>
<button class="btn btn-primary" type="submit">Thêm tài khoản</button> <a class="btn btn-outline-secondary" th:href="@{/admin/quan-ly-tai-khoan}">Hủy</a>
</form></div></section></body></html>
