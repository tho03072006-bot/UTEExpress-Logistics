<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Sửa chi nhánh - UTEExpress</title></head><body><section>
<div class="ute-panel p-4 mx-auto" style="max-width:760px"><div class="sx-panel-head"><div><h1 class="h3" th:text="|Chi nhánh ${branch.code}|"></h1>
<p>Mã và tỉnh phục vụ được giữ cố định. Tọa độ tâm khu vực kho là xấp xỉ, dùng cho sắp lộ trình.</p></div><img th:src="@{/images/shipper/branch-network.svg}" alt="" aria-hidden="true" width="180" height="120"></div>
<form th:action="@{/admin/chi-nhanh/{id}/sua(id=${branch.id})}" th:object="${form}" method="post">
<input type="hidden" th:field="*{revision}">
<div th:if="${#fields.hasAnyErrors()}" class="ute-field-error mb-3" role="alert"><p th:each="e : ${#fields.allErrors()}" th:text="${e}"></p></div>
<div class="mb-3"><label class="form-label" for="name">Tên chi nhánh</label><input class="form-control" th:field="*{name}" required maxlength="100"></div>
<div class="mb-3"><label class="form-label" for="hubAddress">Địa chỉ kho</label><input class="form-control" th:field="*{hubAddress}" required maxlength="255"></div>
<div class="mb-3"><label class="form-label" for="hubAreaCode">Khu vực kho</label><select class="form-select" th:field="*{hubAreaCode}" required>
<option th:each="a : ${areas}" th:if="${a.branchId == branch.id}" th:value="${a.code}" th:text="${a.name}"></option></select></div>
<div class="mb-3"><label class="form-label" for="active">Nhận đơn mới</label><select class="form-select" th:field="*{active}" required><option value="true">Đang nhận</option><option value="false">Tạm ngừng</option></select></div>
<div class="mb-3"><label class="form-label" for="reason">Lý do thay đổi</label><textarea class="form-control" th:field="*{reason}" required minlength="5" maxlength="300"></textarea></div>
<button class="btn btn-primary" type="submit">Lưu thay đổi</button> <a class="btn btn-outline-secondary" th:href="@{/admin/chi-nhanh}">Hủy</a>
</form></div></section></body></html>
