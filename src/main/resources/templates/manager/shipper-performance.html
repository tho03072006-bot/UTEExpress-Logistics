<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head><title>Hiệu suất Shipper - UTEExpress</title></head><body><section><nav th:replace="~{admin/navigation :: navigation}"></nav>
<h1 class="h3">Hiệu suất và tải việc Shipper</h1><p class="text-muted">Tỷ lệ = đã giao / (đã giao + đã hoàn).</p>
<div class="table-responsive"><table class="table"><thead><tr><th>Shipper</th><th>Chờ lấy</th><th>Đang vận chuyển</th><th>Đã giao</th><th>Thất bại đang xử lý</th><th>Đã hoàn</th><th>Tỷ lệ</th></tr></thead><tbody>
<tr th:each="s : ${performance}"><td th:text="|${s.username} · ${s.fullName ?: ''}|"></td><td th:text="${s.pending}"></td><td th:text="${s.inTransit}"></td><td th:text="${s.delivered}"></td><td th:text="${s.failed}"></td><td th:text="${s.returned}"></td><td th:text="|${s.successRate}%|"></td></tr></tbody></table></div>
<a th:if="${performance.hasPrevious()}" th:href="@{/manager/hieu-suat-shipper(page=${performance.number-1})}">Trang trước</a> <a th:if="${performance.hasNext()}" th:href="@{/manager/hieu-suat-shipper(page=${performance.number+1})}">Trang sau</a>
<p class="mt-3"><a th:href="@{/manager/doi-soat-cod}">Xem tiền cước chưa xác nhận và phiếu nộp</a></p></section></body></html>
