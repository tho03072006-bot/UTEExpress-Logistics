<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head><title>Quản lý khiếu nại - UTEExpress</title></head><body><section>
<nav th:replace="~{admin/navigation :: navigation}"></nav>
<div class="ute-page-head sx-art-complaint"><div><h2>Khiếu nại vận đơn</h2><p>Phản hồi khiếu nại của người gửi.</p></div></div>
<form class="ute-panel d-flex flex-wrap gap-3 align-items-end mb-4" method="get" th:action="@{/manager/khieu-nai}">
    <div><label for="complaintStatus" class="form-label">Trạng thái xử lý</label>
        <select name="status" id="complaintStatus" class="form-select"><option value="">Tất cả</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:selected="${s == selectedStatus}" th:text="${s.label}"></option></select></div>
    <button class="btn btn-primary" type="submit">Lọc hồ sơ</button>
</form>
<div class="ute-panel"><div class="table-responsive"><table class="table align-middle mb-0">
    <thead><tr><th>Vận đơn</th><th>Tiêu đề</th><th>Trạng thái</th><th>Ngày gửi</th><th>Thao tác</th></tr></thead>
    <tbody><tr th:if="${complaints.empty}"><td colspan="5" class="text-muted py-4">Không có khiếu nại phù hợp.</td></tr>
    <tr th:each="complaint : ${complaints.content}"><td th:text="${complaint.trackingCode}"></td><td th:text="${complaint.subject}"></td>
        <td><span class="badge badge-ute" th:text="${complaint.status.label}"></span></td>
        <td th:text="${#temporals.format(complaint.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
        <td><a class="btn btn-outline-primary btn-sm" th:href="@{/manager/khieu-nai/{id}(id=${complaint.id})}">Xử lý</a></td></tr></tbody>
</table></div></div>
<nav th:if="${complaints.totalPages > 1}" class="d-flex gap-3 align-items-center mt-4" aria-label="Phân trang khiếu nại">
    <a th:if="${complaints.hasPrevious()}" class="btn btn-outline-secondary" th:href="@{/manager/khieu-nai(page=${complaints.number - 1},status=${selectedStatus})}">Trang trước</a>
    <span th:text="|Trang ${complaints.number + 1}/${complaints.totalPages}|"></span>
    <a th:if="${complaints.hasNext()}" class="btn btn-outline-secondary" th:href="@{/manager/khieu-nai(page=${complaints.number + 1},status=${selectedStatus})}">Trang sau</a>
</nav>
</section></body></html>
