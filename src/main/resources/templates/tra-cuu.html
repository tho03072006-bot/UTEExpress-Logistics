<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu vận đơn - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 560px;">
    <h2 class="mb-4">Tra cứu vận đơn</h2>

    <form method="get" th:action="@{/tra-cuu}" class="d-flex gap-2 mb-4">
        <input type="text" name="trackingCode" class="form-control" placeholder="Nhập mã vận đơn (VD: UTE12345678)" required>
        <button type="submit" class="btn btn-primary">Tra cứu</button>
    </form>

    <div th:if="${searched}">
        <div th:if="${order == null}" class="alert alert-warning">Không tìm thấy vận đơn này.</div>

        <div th:if="${order != null}" class="card">
            <div class="card-body">
                <h5 class="card-title" th:text="${order.trackingCode}">UTE00000000</h5>
                <p>Người nhận: <span th:text="${order.receiverName}">-</span></p>
                <p>Dịch vụ: <span th:text="${order.serviceType}">-</span></p>
                <p>Trạng thái: <span class="badge bg-primary" th:text="${order.status}">-</span></p>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
