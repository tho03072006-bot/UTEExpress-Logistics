<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
<head><title>Tài khoản của tôi - UTEExpress</title></head><body>
<section class="shipper-workspace sx-account">
    <div class="shipper-notice sx-notice-success" role="status" th:if="${message}"><i class="bi bi-check-circle-fill"></i><span th:text="${message}"></span></div>
    <div class="shipper-notice sx-notice-danger" role="alert" th:if="${error}"><i class="bi bi-exclamation-octagon-fill"></i><span th:text="${error}"></span></div>

    <div th:replace="~{fragments/account :: hero(${profile}, '/shipper/tai-khoan')}"></div>
    <div th:replace="~{fragments/account :: stats(${profile})}"></div>

    <div class="row g-4">
        <div class="col-xl-7">
            <div class="ute-panel mb-4">
                <h5 class="mb-3 sx-head"><span class="sx-head-icon sx-tone-blue"><i class="bi bi-person-lines-fill"></i></span> Thông tin liên hệ</h5>
                <form method="post" th:object="${form}" th:action="@{/shipper/tai-khoan/cap-nhat}" class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="fullName">Họ và tên</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control" maxlength="100">
                        <div class="ute-field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                    <div class="col-sm-7">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" readonly>
                        <div class="form-text">Email do quản trị cấp; liên hệ Manager nếu cần đổi.</div>
                    </div>
                    <div class="col-sm-5">
                        <label class="form-label" for="phone">Số điện thoại</label>
                        <input type="text" id="phone" th:field="*{phone}" class="form-control" placeholder="0901234567">
                        <div class="form-text">Người gửi và người nhận gọi vào số này.</div>
                        <div class="ute-field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-12"><button type="submit" class="btn btn-primary">Lưu thông tin liên hệ</button></div>
                </form>
            </div>

            <div th:replace="~{fragments/account :: details('/shipper/tai-khoan')}"></div>
        </div>

        <div class="col-xl-5">
            <div th:replace="~{fragments/account :: completeness(${profile})}"></div>
            <div class="ute-panel mb-4">
                <h5 class="mb-3 sx-head"><span class="sx-head-icon sx-tone-amber"><i class="bi bi-bell"></i></span> Thông báo trên thiết bị này</h5>
                <label class="sx-switch-row">
                    <span><strong>Hiện thông báo nổi khi có đơn mới</strong>
                        <small>Dải thông báo đầu trang khi Manager phân công đơn. Chuông vẫn đếm số chưa đọc.</small></span>
                    <span class="form-check form-switch m-0">
                        <input class="form-check-input" type="checkbox" role="switch" checked data-shipper-popup-toggle>
                    </span>
                </label>
            </div>

            <div class="ute-panel mb-4">
                <h5 class="mb-3 sx-head"><span class="sx-head-icon sx-tone-rose"><i class="bi bi-shield-lock"></i></span> Bảo mật &amp; tài khoản</h5>
                <dl class="sx-info-list">
                    <div><dt>Tên đăng nhập</dt><dd th:text="${profile.account.username}">shipper</dd></div>
                    <div><dt>Vai trò</dt><dd>Shipper</dd></div>
                    <div><dt>Ngày tạo</dt><dd th:text="${profile.account.createdAt != null ? #temporals.format(profile.account.createdAt, 'dd/MM/yyyy') : '—'}">01/01/2026</dd></div>
                </dl>
                <a th:href="@{/shipper/tai-khoan/doi-mat-khau}" class="btn sx-btn-white w-100"><i class="bi bi-key"></i> Đổi mật khẩu</a>
            </div>

            <div class="ute-panel">
                <h5 class="mb-3 sx-head"><span class="sx-head-icon sx-tone-teal"><i class="bi bi-lightning-charge"></i></span> Lối tắt công việc</h5>
                <div class="sx-link-list">
                    <a th:href="@{/shipper/lo-trinh}"><i class="bi bi-signpost-split"></i> Lộ trình hôm nay <i class="bi bi-chevron-right"></i></a>
                    <a th:href="@{/shipper/doi-soat}"><i class="bi bi-cash-coin"></i> Nộp tiền COD <i class="bi bi-chevron-right"></i></a>
                    <a th:href="@{/shipper/thong-ke}"><i class="bi bi-graph-up-arrow"></i> Thống kê giao hàng <i class="bi bi-chevron-right"></i></a>
                </div>
            </div>
        </div>
    </div>
    <script th:src="@{/js/shipper-workspace.js}"></script>
</section></body></html>
