<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head>
    <title>Đặt lại mật khẩu - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-2">Đặt lại mật khẩu</h2>

<!--
  Thông báo này cố ý không nói email có tồn tại hay không - nếu báo "email chưa đăng ký"
  thì người lạ có thể dò xem email nào đang có tài khoản trong hệ thống.
-->
<div th:if="${otpJustSent}" class="alert alert-success">
    Nếu email này đã đăng ký tài khoản, mã OTP vừa được gửi tới hộp thư.
    Mã có hiệu lực trong 10 phút.
</div>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div class="ute-panel">
    <form method="post" th:action="@{/dat-lai-mat-khau}" th:object="${form}">
        <div class="mb-3">
            <label class="form-label" for="email">Email đã đăng ký</label>
            <input type="email" th:field="*{email}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="otp">Mã OTP (6 số)</label>
            <input type="text" th:field="*{otp}" class="form-control" maxlength="6"
                   inputmode="numeric" autocomplete="one-time-code" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">Mật khẩu mới</label>
            <input type="password" th:field="*{newPassword}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Nhập lại mật khẩu mới</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Đặt lại mật khẩu</button>
    </form>
</div>

<p class="text-center mt-3 small">
    Chưa nhận được mã? <a th:href="@{/quen-mat-khau}">Gửi lại mã OTP</a>
</p>
<p class="text-center small">
    <a th:href="@{/dang-nhap}">Quay lại đăng nhập</a>
</p>
</section>

</body>
</html>
