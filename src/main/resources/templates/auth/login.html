<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head>
    <title>Đăng nhập - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-4">Đăng nhập</h2>

<div th:if="${activated}" class="alert alert-success">Kích hoạt tài khoản thành công, đăng nhập ngay.</div>
<div th:if="${passwordReset}" class="alert alert-success">
    Đặt lại mật khẩu thành công. Hãy đăng nhập bằng mật khẩu mới.
</div>
<div th:if="${param.error}" class="alert alert-danger">Sai tên đăng nhập, mật khẩu, hoặc tài khoản chưa kích hoạt OTP.</div>
<div th:if="${param.logout}" class="alert alert-info">Bạn đã đăng xuất.</div>

<!-- Form nay do Spring Security formLogin xu ly (action mac dinh /dang-nhap, POST) -->
<div class="ute-panel">
<form method="post" th:action="@{/dang-nhap}">
    <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" name="username" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
</form>
</div>
<p class="text-center mt-3 small">
    <a th:href="@{/quen-mat-khau}">Quên mật khẩu?</a>
</p>
<p class="text-center small">Chưa có tài khoản? <a th:href="@{/dang-ky}">Đăng ký</a></p>
</section>

</body>
</html>
