<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap - UTEExpress</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>

<main class="container py-5" style="max-width: 420px;">
    <h2 class="mb-4">Dang nhap</h2>
    <!-- TODO: form nay se do Spring Security formLogin xu ly (action mac dinh /dang-nhap, POST) -->
    <form method="post" th:action="@{/dang-nhap}">
        <div class="mb-3">
            <label class="form-label">Ten dang nhap</label>
            <input type="text" name="username" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Mat khau</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Dang nhap</button>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
