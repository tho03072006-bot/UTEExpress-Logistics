<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head>
    <title>Xác thực OTP - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-3">Xác thực OTP</h2>
<p class="text-muted">
    Mã OTP đã được gửi tới email bạn đăng ký và có hiệu lực trong 10 phút.
</p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:if="${message}" class="alert alert-success" role="status" th:text="${message}"></div>

<form method="post" th:action="@{/xac-thuc-otp}">
    <input type="hidden" name="username" th:value="${username}">
    <div class="mb-3">
        <label class="form-label" for="otp">Mã OTP (6 số)</label>
        <input id="otp" type="text" name="otp" class="form-control" minlength="6" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Xác thực</button>
</form>
<form method="post" th:action="@{/xac-thuc-otp/gui-lai}" class="mt-3">
    <input type="hidden" name="username" th:value="${username}">
    <button type="submit" class="btn btn-outline-primary w-100">Gửi mã kích hoạt mới</button>
    <p class="form-text">Có thể yêu cầu mã mới sau 60 giây.</p>
</form>
</section>

</body>
</html>
