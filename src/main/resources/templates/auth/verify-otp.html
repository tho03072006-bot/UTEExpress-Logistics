<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head>
    <title>Xác thực OTP - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-3">Xác thực OTP</h2>
<p class="text-muted">
    Mã OTP đã được gửi tới email bạn đăng ký và có hiệu lực trong 10 phút.
</p>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<form method="post" th:action="@{/xac-thuc-otp}">
    <input type="hidden" name="username" th:value="${username}">
    <div class="mb-3">
        <label class="form-label">Mã OTP (6 số)</label>
        <input type="text" name="otp" class="form-control" maxlength="6" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Xác thực</button>
</form>
</section>

</body>
</html>
