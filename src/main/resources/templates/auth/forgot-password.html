<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, false)}">
<head>
    <title>Quên mật khẩu - UTEExpress</title>
</head>
<body>

<section class="ute-narrow-sm">
<h2 class="mb-2">Quên mật khẩu</h2>
<p class="text-muted">
    Nhập email bạn đã dùng để đăng ký. Hệ thống sẽ gửi một mã OTP gồm 6 chữ số,
    dùng mã đó để đặt lại mật khẩu mới.
</p>

<div class="ute-panel">
    <form method="post" th:action="@{/quen-mat-khau}">
        <div class="mb-3">
            <label class="form-label" for="email">Email đã đăng ký</label>
            <input type="email" id="email" name="email" class="form-control" required autofocus
                   placeholder="ban@example.com">
        </div>
        <button type="submit" class="btn btn-primary w-100">Gửi mã OTP</button>
    </form>
</div>

<p class="text-center mt-3 small">
    Nhớ ra mật khẩu rồi? <a th:href="@{/dang-nhap}">Quay lại đăng nhập</a>
</p>
<p class="text-center small">
    Đã có mã trong email? <a th:href="@{/dat-lai-mat-khau}">Nhập mã để đặt lại mật khẩu</a>
</p>
</section>

</body>
</html>
