<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="doc(pageTitle, content, withSidebar)"
      lang="vi">
<!--/*
  TEMPLATE DÙNG CHUNG CHO TOÀN BỘ WEBSITE UTEExpress.

  Mọi trang đều đi qua đúng file này - đó là "01 template Bootstrap" của đồ án.
  Trang con chỉ viết phần nội dung riêng, không tự dựng lại <head>, navbar hay footer:

      <!DOCTYPE html>
      <html xmlns:th="http://www.thymeleaf.org"
            th:replace="~{fragments/base :: doc(~{::title}, ~{::section}, true)}">
      <head><title>Tên trang - UTEExpress</title></head>
      <body>
      <section> ...nội dung riêng của trang... </section>
      </body>
      </html>

  Tham số thứ ba (withSidebar):
    true  - trang trong khu vực đã đăng nhập, có thanh điều hướng bên trái
    false - trang công khai (trang chủ, tra cứu, đăng nhập/đăng ký), chỉ có thanh trên
*/-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${pageTitle}">UTEExpress</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Be Vietnam Pro: font Google thiết kế riêng cho tiếng Việt, dấu hiển thị cân đối hơn font mặc định -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!--/*
      Gan che do sang/toi NGAY o <head>, truoc khi trinh duyet ve than trang.
      Neu de xuong cuoi trang moi chay thi nguoi dung se thay mot nhay trang toat
      roi moi doi sang nen toi - kho chiu va nhin nhu loi.

      Chua tung chon lan nao thi theo cai dat cua he dieu hanh (prefers-color-scheme).
      Bao try/catch vi trinh duyet o che do rieng tu co the chan localStorage.
    */-->
    <script th:inline="none">
        (function () {
            try {
                var saved = localStorage.getItem('ute-theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>

<body class="ute-body">

<!-- ===================== Thanh trên cùng ===================== -->
<header class="ute-topbar">
    <div class="ute-topbar-inner">
        <!-- Nút mở menu, chỉ hiện trên màn hình nhỏ và chỉ ở khu vực có sidebar -->
        <button th:if="${withSidebar}" class="btn btn-sm ute-menu-toggle d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#uteSidebarMobile"
                aria-controls="uteSidebarMobile" aria-label="Mở menu">
            <i class="bi bi-list"></i>
        </button>

        <a class="ute-brand" th:href="@{/}">
            <span class="ute-brand-dot"></span>
            UTEExpress
        </a>

        <nav class="ute-topbar-nav">
            <a class="ute-topbar-link d-none d-md-inline" th:href="@{/}">Trang chủ</a>
            <a class="ute-topbar-link d-none d-md-inline" th:href="@{/tra-cuu}">Tra cứu vận đơn</a>
            <a class="ute-topbar-link d-none d-lg-inline" th:href="@{/uoc-tinh-cuoc}">Ước tính cước</a>

            <!-- Chi mot nut, doi qua lai giua hai che do. Icon nao hien do CSS quyet dinh. -->
            <button type="button" class="btn btn-sm ute-theme-toggle" id="uteThemeToggle"
                    aria-label="Chuyển chế độ sáng / tối" title="Chuyển chế độ sáng / tối">
                <i class="bi bi-moon-stars"></i>
                <i class="bi bi-sun-fill"></i>
            </button>

            <span sec:authorize="isAuthenticated()" class="ute-user-chip">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">user</span>
            </span>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm ute-btn-ghost">Đăng xuất</button>
            </form>

            <a sec:authorize="isAnonymous()" class="ute-topbar-link" th:href="@{/dang-ky}">Đăng ký</a>
            <a sec:authorize="isAnonymous()" class="btn btn-sm ute-btn-ghost" th:href="@{/dang-nhap}">Đăng nhập</a>
        </nav>
    </div>
</header>

<!-- ===================== Thân trang ===================== -->
<div th:class="${withSidebar} ? 'ute-shell ute-shell-with-sidebar' : 'ute-shell'">

    <!-- Sidebar cố định cho màn hình lớn -->
    <aside th:if="${withSidebar}" class="ute-sidebar d-none d-lg-block">
        <nav th:replace="~{fragments/components :: sidebarNav}"></nav>
    </aside>

    <!-- Cùng menu đó nhưng dạng trượt ra, dùng cho điện thoại / máy tính bảng -->
    <div th:if="${withSidebar}" class="offcanvas offcanvas-start ute-sidebar-offcanvas" tabindex="-1"
         id="uteSidebarMobile" aria-labelledby="uteSidebarMobileLabel">
        <div class="offcanvas-header">
            <h6 class="offcanvas-title mb-0" id="uteSidebarMobileLabel">Điều hướng</h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Đóng"></button>
        </div>
        <div class="offcanvas-body p-0">
            <nav th:replace="~{fragments/components :: sidebarNav}"></nav>
        </div>
    </div>

    <main class="ute-main">
        <div class="ute-main-inner">
            <div th:replace="${content}">Nội dung của từng trang được chèn vào đây.</div>
        </div>
    </main>
</div>

<footer class="ute-footer">
    <div class="ute-footer-inner">
        <span>UTEExpress &middot; Đồ án Lập trình Web WEBPR330479 &middot; HCMUTE</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/address-picker.js}"></script>

</body>
</html>
