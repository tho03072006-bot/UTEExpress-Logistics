<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--
      Fragment dung chung: header (navbar Bootstrap) va footer.
      Cac trang khac chen bang: <div th:replace="~{fragments/layout :: header}"></div>
      Dung sec:authorize de an/hien menu theo trang thai dang nhap (can dependency
      thymeleaf-extras-springsecurity6 da them trong pom.xml).
    -->
</head>
<body>

<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark navbar-ute">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <span class="brand-dot"></span>
                UTEExpress
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/tra-cuu}">Tra cứu vận đơn</a></li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/nguoi-dung/tao-don}">Tạo đơn</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/nguoi-dung/don-hang}">Đơn hàng của tôi</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/nguoi-dung/dia-chi}">Sổ địa chỉ</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <!-- cartCount chi co o cac trang cua TV1 (UserCartBadgeAdvice), trang khac tu an con so -->
                        <a class="nav-link" th:href="@{/nguoi-dung/gio-don}">
                            Giỏ đơn
                            <span class="badge badge-ute"
                                  th:if="${cartCount != null and cartCount > 0}"
                                  th:text="${cartCount}">0</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="nav-link text-light-emphasis" sec:authentication="name"></span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-light">Đăng xuất</button>
                        </form>
                    </li>

                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/dang-ky}">Đăng ký</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAnonymous()">
                        <a class="nav-link" th:href="@{/dang-nhap}">Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>

<!--
  Hien so tien theo dinh dang Viet Nam: 32500 -> "32.500 đ" (dau cham ngan cach hang nghin).
  Dung o moi noi hien tien de khoi moi trang mot kieu:
      <span th:replace="~{fragments/layout :: money(${order.shippingFee})}">0 đ</span>
  Luu y: trong <td> phai boc bang <span> roi th:replace cai <span> do, khong th:replace thang <td>.
-->
<span th:fragment="money(amount)"
      th:text="${amount == null ? '—' : #numbers.formatInteger(amount, 1, 'POINT') + ' đ'}">0 đ</span>

<div th:fragment="footer">
    <footer class="footer-ute text-light text-center py-3 mt-5">
        <small>UTEExpress &middot; Đồ án Lập trình Web WEBPR330479 &middot; HCMUTE</small>
    </footer>
</div>

</body>
</html>
