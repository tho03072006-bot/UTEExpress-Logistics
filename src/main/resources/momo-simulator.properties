spring.application.name=uteexpress-momo-simulator
server.address=0.0.0.0
server.port=${PORT:8081}
server.forward-headers-strategy=framework
server.servlet.session.timeout=15m
server.servlet.session.cookie.name=MOMO_SIM_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.accesslog.enabled=false
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.accept-count=30
server.tomcat.max-connections=100
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=15s
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.max-parameters=20
server.tomcat.max-http-form-post-size=4KB
server.max-http-request-header-size=8KB
spring.servlet.multipart.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.thymeleaf.cache=true
spring.main.banner-mode=off
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
