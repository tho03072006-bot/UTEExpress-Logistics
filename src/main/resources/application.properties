spring.application.name=uteexpress
server.port=8080

# Nap them application-local.properties neu file nay ton tai tren may ban (file da duoc
# them vao .gitignore, khong bao gio len Git). Dung de ghi de mat khau that thay cho
# cac gia tri CHANGE_ME o duoi - xem application-local.properties.example de biet cach dung.
spring.config.import=optional:application-local.properties

# ===== Database: SQL Server (giong moi truong da dung o Baitap02: localhost,1433) =====
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=uteexpress;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Thymeleaf: tat cache luc dev de sua HTML khong can restart app =====
spring.thymeleaf.cache=false

# ===== Mail (dung gui OTP dang ky / quen mat khau) =====
# Vi du dung Gmail SMTP: bat "App password" trong tai khoan Google roi dien vao day
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=CHANGE_ME@gmail.com
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Ten hien thi o o "Nguoi gui" trong hop thu nguoi nhan.
# Gmail KHONG cho doi phan dia chi - thu van phai gui tu dung hop thu da xac thuc
# SMTP o tren. Nhung ten hien thi thi dat tu do, nen nguoi nhan se thay
# "UTEExpress" thay vi ten tai khoan gmail ca nhan.
# De trong thi Spring tu lay spring.mail.username lam nguoi gui.
app.mail.from-name=UTEExpress

# ===== JWT (API tra cuu van don cong khai) =====
app.jwt.secret=CHANGE_ME_chuoi_bi_mat_toi_thieu_32_ky_tu_0123456789
app.jwt.expiration-ms=86400000

# LUU Y: cac gia tri CHANGE_ME o tren la placeholder, KHONG phai mat khau that.
# Dien mat khau/SMTP that cua ban tren may minh, kiem tra lai muc 06 (.gitignore)
# trong ke hoach truoc khi commit neu khong muon lo mat khau len GitHub public.

# ===== Tep nguoi dung tai len (anh/video dinh kem danh gia dich vu) =====
# Thu muc luu tep that, tinh tu thu muc chay app. De ngoai src/ vi thu muc static/
# bi dong goi vao file jar luc build - ghi vao do luc chay se mat file moi lan build lai.
# Thu muc nay da duoc them vao .gitignore, khong day tep nguoi dung len GitHub.
app.upload.dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
