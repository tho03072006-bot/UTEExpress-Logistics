# Duoc application.properties nap bat buoc; khong co fallback SQL Server.
spring.config.import=optional:file:./config/aiven-local.properties
spring.datasource.url=jdbc:mysql://${AIVEN_HOST}:${AIVEN_PORT}/${AIVEN_DATABASE}
spring.datasource.username=${AIVEN_USER}
spring.datasource.password=${AIVEN_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${AIVEN_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=false
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
spring.datasource.hikari.data-source-properties.connectionTimeZone=+07:00
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true
spring.datasource.hikari.data-source-properties.preserveInstants=false
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30000
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# CSDL cloud dung chung: app chi kiem tra schema, khong tu ALTER/DROP khi moi nguoi chay.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Toc do: Aiven o xa, moi lan di ve may chu mat ~100 ms. Mac dinh moi giao dich ton them 4 lan di ve
# (SET autocommit=0/1, SET read only/read write) ngoai COMMIT; cac dong duoi bo cac lenh thua do.
# Moi thao tac ghi cua app deu nam trong @Transactional (repository Spring Data cung vay) nen tat
# auto-commit o pool la an toan; Hibernate duoc bao truoc de khong bat/tat lai moi giao dich.
spring.datasource.hikari.auto-commit=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.readOnlyPropagatesToServer=false
# Nap cac doi tuong lien quan (vd nguoi gui cua 10 don) bang mot truy van "where id in (...)" thay vi tung cau.
spring.jpa.properties.hibernate.default_batch_fetch_size=20
